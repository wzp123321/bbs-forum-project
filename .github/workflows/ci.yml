name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: 后端测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven 单元/切片测试
        working-directory: server/bbs-admin
        run: mvn -B test
      - name: Maven 打包（跳过重复测试）
        working-directory: server/bbs-admin
        run: mvn -B -DskipTests package

  frontend-test:
    name: 前端单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: 安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Vitest + 覆盖率
        working-directory: web
        run: pnpm test:coverage

  build-frontend:
    name: 前端构建
    needs: [frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: 安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 构建 bbs-web
        working-directory: web
        run: pnpm web:build
      - name: 构建 bbs-admin
        working-directory: web
        run: pnpm admin:build

  e2e:
    name: E2E 冒烟
    needs: [frontend-test, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: 安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 安装 Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        working-directory: web
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  ai-eval:
    name: AI 评测冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 离线评测（mock 适配器）
        working-directory: eval
        run: npm run eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/reports/latest.md

  docker-build:
    name: Docker 镜像构建
    needs: [backend-test, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: server/bbs-admin
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bbs-admin:latest
      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bbs-web:latest
