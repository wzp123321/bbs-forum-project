server:
  port: ${SERVER_PORT:9999}
  shutdown: graceful

spring:
  application:
    name: ${APP_NAME:bbs-admin}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
#配置数据源
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      # 单个文件最大 10MB
      max-file-size: 10MB
      # 单次请求最大 50MB
      max-request-size: 50MB
      # 内存中超过此大小的部分会写入临时文件
      file-size-threshold: 1MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # 驱动包名
    url: ${DB_URL:jdbc:mysql://localhost:3306/bbs?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    type: com.alibaba.druid.pool.DruidDataSource
    # druid 连接池管理
    druid:
      # 初始化时建立物理连接的个数
      initial-size: 5
      # 连接池的最小空闲数量
      min-idle: 5
      # 连接池最大连接数量
      max-active: 20
      # 获取连接时最大等待时间，单位毫秒
      max-wait: 60000
      # 申请连接的时候检测，如果空闲时间大于timeBetweenEvictionRunsMillis，执行validationQuery检测连接是否有效。
      test-while-idle: true
      # 既作为检测的间隔时间又作为testWhileIdel执行的依据
      time-between-eviction-runs-millis: 60000
      # 销毁线程时检测当前连接的最后活动时间和当前时间差大于该值时，关闭当前连接(配置连接在池中的最小生存时间)
      min-evictable-idle-time-millis: 30000
      # 用来检测数据库连接是否有效的sql 必须是一个查询语句(oracle中为 select 1 from dual)
      validation-query: select 1 from dual
      # 申请连接时会执行validationQuery检测连接是否有效,开启会降低性能,默认为true
      test-on-borrow: false
      # 归还连接时会执行validationQuery检测连接是否有效,开启会降低性能,默认为true
      test-on-return: false
      # 是否缓存preparedStatement, 也就是PSCache,PSCache对支持游标的数据库性能提升巨大，比如说oracle,在mysql下建议关闭。
      pool-prepared-statements: false
      # 置监控统计拦截的filters，去掉后监控界面sql无法统计，stat: 监控统计、Slf4j:日志记录、waLL: 防御sqL注入
      filters: stat,wall
      # 要启用PSCache，必须配置大于0，当大于0时，poolPreparedStatements自动触发修改为true。在Druid中，不会存在Oracle下PSCache占用内存过多的问题，可以把这个数值配置大一些，比如说100
      max-pool-prepared-statement-per-connection-size: -1
      # 合并多个DruidDataSource的监控数据
      use-global-data-source-stat: true
      # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
      connect-properties:
        druid.stat.mergeSql: true
        druid.stat.slowSqlMillis: 5000

      web-stat-filter:
        # 是否启用StatFilter默认值true
        enabled: true
        # 添加过滤规则
        url-pattern: /*
        # 忽略过滤的格式
        exclusions: /druid/*,*.js,*.gif,*.jpg,*.png,*.css,*.ico

      stat-view-servlet:
        # 是否启用StatViewServlet默认值true
        enabled: true
        # 访问路径为/druid时，跳转到StatViewServlet
        url-pattern: /druid/*
        # 是否能够重置数据
        reset-enable: false
        # 需要账号密码才能访问控制台，默认为root
        login-username: ${DRUID_USERNAME:druid}
        login-password: ${DRUID_PASSWORD:druid}
        # IP白名单
        allow: 127.0.0.1
        # IP黑名单（共同存在时，deny优先于allow）
        deny:

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId:-}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId:-}] %-5level %logger{36} - %msg%n"
  level:
    root: info
    com.bbs.bbsadmin: debug
    com.alibaba.druid: warn
    com.baomidou.mybatisplus: warn
    org.springframework.web: warn
    org.springframework.boot.actuator: warn
  file:
    name: logs/htctbs-service.log

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

knife4j:
  # 开启增强配置
  enable: ${KNIFE4J_ENABLED:true}
  # 开启生产环境屏蔽
  production: ${KNIFE4J_PRODUCTION:false}
  # 开启Swagger的Basic认证功能,默认是false
  basic:
    enable: true
    # Basic认证用户名
    username: ${KNIFE4J_USERNAME:admin}
    # Basic认证密码
    password: ${KNIFE4J_PASSWORD:123456}

# 附件上传 自定义配置
bbs:
  jwt:
    # 生产环境必须通过 BBS_JWT_SECRET 注入, 至少 32 字节
    secret: ${BBS_JWT_SECRET:bbs-admin-default-secret-key-please-change-in-production-32+bytes}
    expire-millis: ${BBS_JWT_EXPIRE_MILLIS:604800000}
  # 缓存与搜索：默认保持原有 Caffeine + SQL LIKE，可按需切换
  cache:
    type: ${CACHE_TYPE:caffeine}
    ttl-seconds: ${CACHE_TTL_SECONDS:600}
  search:
    engine: ${SEARCH_ENGINE:sql}
    es:
      url: ${ES_URL:http://localhost:9200}
      index: ${ES_INDEX:bbs-post}
  auth:
    # 管理员 userId 列表 (逗号分隔), 可通过 BBS_ADMIN_USER_IDS 覆盖
    admin-user-ids: ${BBS_ADMIN_USER_IDS:b367c1d27d384bfeb435fb2e8e20072d}
  upload:
    # 本地存储根目录 (相对于 jar 运行目录)
    base-dir: ${BBS_UPLOAD_DIR:./uploads}
    # 对外访问 URL 前缀
    url-prefix: /upload/
    # 允许的扩展名 (逗号分隔,小写), 空表示不限制
    allowed-extensions: jpg,jpeg,png,gif,webp,bmp,svg,ico,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,zip,rar,7z,mp3,mp4
    # 允许的 MIME 类型前缀, 用于 content-type 校验
    allowed-content-types-prefix: image/,video/,audio/,application/pdf,application/zip,application/msword,application/vnd.openxmlformats-officedocument,text/plain,application/x-rar-compressed,application/x-7z-compressed

# 可观测性: 健康检查 / 指标 / Prometheus 抓取
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSURE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:when-authorized}
  metrics:
    tags:
      application: ${APP_NAME:bbs-admin}
